name: Bug report
description: Something behaves differently than it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For anything security-related, do **not** open an issue — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it.
      placeholder: |
        1. pnpm bootstrap
        2. Sign in as owner@example.com
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Exact error text or stack trace, if there is one.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0, or the commit SHA

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API (apps/api)
        - Web (apps/web)
        - Database / migrations
        - Auth
        - Billing / entitlements
        - Build, tooling, or CI
        - Not sure

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: macOS 15
        Node: 22.x
        pnpm: 10.x
        Docker: 27.x
